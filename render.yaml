services:
  - type: web
    name: batch-watermark-studio
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 7860
      - key: HOST
        value: 0.0.0.0
