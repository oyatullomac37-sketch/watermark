version: '3.8'

services:
  watermark-studio:
    build: .
    container_name: watermark_studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - HOST=0.0.0.0
      - PORT=7860
    volumes:
      # Uploaded batch images and logos persist on the host
      - ./uploads:/app/uploads
      # Processed watermarked images persist on the host
      - ./watermarked_output:/app/watermarked_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
