# Nginx Reverse Proxy Configuration for Batch Watermark Studio
# Joylashuv: /etc/nginx/sites-available/watermark.conf

server {
    listen 80;
    server_name sizning-domeningiz.uz www.sizning-domeningiz.uz;

    # Katta hajmdagi rasmlar va ZIP yuklash uchun limitni oshirish (500 MB)
    client_max_body_size 500M;

    # Gzip siqish
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1000+ rasmlar qayta ishlanishida ulanish uzilib qolmasligi uchun vaqt
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
